name: Reusable Pages deployment
on:
  workflow_call:
    inputs:
      site-directory:
        description: Product repository site source directory
        type: string
        default: site
      deploy-enabled:
        description: Explicit opt-in after a separately reviewed production cutover
        type: boolean
        default: false
jobs:
  build:
    if: inputs.deploy-enabled && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout shared site platform
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .site-platform-host
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install platform dependencies
        run: npm ci --prefix .site-platform-host
      - name: Install test browser
        run: npx --prefix .site-platform-host playwright install --with-deps chromium
      - name: Build and validate site
        env:
          SITE_DIRECTORY: ${{ inputs.site-directory }}
        run: |
          node .site-platform-host/src/build.mjs --site "$SITE_DIRECTORY" --out site-dist --production
          node .site-platform-host/src/check.mjs site-dist
      - name: Browser smoke and accessibility checks
        working-directory: .site-platform-host
        env:
          SITE_DIST: ${{ github.workspace }}/site-dist
        run: npm run test:browser
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: site-platform-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
